<div class="voice-panel">
  <div class="voice-row"><button id="voice-start" type="button">🎙 Listen for a command</button><button id="voice-stop" type="button" disabled>Stop listening</button><label>Speech language <select id="voice-language"><option value="en-IN">English (India)</option><option value="ta-IN">Tamil</option></select></label></div>
  <label><input id="voice-spoken" type="checkbox"> Read command feedback aloud</label>
  <p id="voice-status" role="status" aria-live="polite">Press Listen, allow your microphone, then speak one command.</p>
  <p id="voice-transcript" aria-live="polite"></p>
</div>
